[project]
name = "simtradedata"
version = "1.2.0"
description = "为 simtradelab 项目提供数据支持的配套工具库"
authors = [
    {name = "kayou",email = "kayou@duck.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "baostock>=0.9.1,<1.0.0",
    "tqdm>=4.66.1,<5.0.0",
    "duckdb>=1.2.0,<2.0.0",
    "pyarrow>=10.0.0,<20.0.0",
    "yfinance>=0.2.0",
    "mootdx (>=0.11.7,<0.12.0)",
    "cachetools>=6.2.1,<7.0.0",
    "lxml>=4.9.2,<7.0.0",
]

# CLI entry points (run scripts directly with poetry run python scripts/xxx.py)


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pandas = ">=1.5.3,<2.0.0"
flask = "^3.1.1"
flask-cors = "^6.0.1"
black = "^25.1.0"
isort = "^6.0.1"
autoflake = "^2.3.1"
pre-commit = "^4.2.0"
pytest-cov = "^7.0.0"
pytest-benchmark = "^5.1.0"
ruff = "^0.15.19"
pydantic = ">=1.10.7,<2.0.0"
cachetools = ">=5.3.0,<6.0.0"
joblib = ">=1.3.1,<2.0.0"
baostock = ">=0.8.9,<1.0.0"
jupyter = "^1.1.1"
numpy = ">=1.23.5,<2"

[[tool.poetry.source]]
name = "tsinghua"
url = "https://mirrors.aliyun.com/simple"
priority = "primary"

